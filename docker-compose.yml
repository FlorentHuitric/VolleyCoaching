# ============================================
# VolleyCoaching - Production Docker Compose
# Traefik reverse proxy + Let's Encrypt SSL
# Domain: coach.florent-huitric.fr
# ============================================

services:
  # Frontend Next.js
  frontend:
    container_name: volleycoaching-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_GRAPHQL_URL: https://api-coach.florent-huitric.fr/graphql
        NEXT_PUBLIC_API_URL: https://api-coach.florent-huitric.fr
    restart: always
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - volleycoaching_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.volleycoaching-frontend.rule=Host(`coach.florent-huitric.fr`)"
      - "traefik.http.routers.volleycoaching-frontend.entrypoints=websecure"
      - "traefik.http.routers.volleycoaching-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.volleycoaching-frontend.loadbalancer.server.port=3000"

  # Backend API (Express + Apollo GraphQL + Prisma)
  backend:
    container_name: volleycoaching-backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: https://coach.florent-huitric.fr
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: volleycoaching
      JWT_SECRET: ${JWT_SECRET}
      MINIO_PUBLIC_URL: https://storage-coach.florent-huitric.fr
      SEED_DB: ${SEED_DB:-false}
      POSTGRES_USER: ${POSTGRES_USER}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - volleycoaching_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.volleycoaching-api.rule=Host(`api-coach.florent-huitric.fr`)"
      - "traefik.http.routers.volleycoaching-api.entrypoints=websecure"
      - "traefik.http.routers.volleycoaching-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.volleycoaching-api.loadbalancer.server.port=3001"
      # Headers pour WebSocket
      - "traefik.http.middlewares.volleycoaching-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.volleycoaching-api.middlewares=volleycoaching-headers"

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: volleycoaching-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - volleycoaching_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volleyuser -d volleycoaching"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: volleycoaching-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - volleycoaching_net

  # MinIO - S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: volleycoaching-minio
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - volleycoaching_net
      - proxy
    labels:
      - "traefik.enable=true"
      # MinIO API (for public file access)
      - "traefik.http.routers.volleycoaching-storage.rule=Host(`storage-coach.florent-huitric.fr`)"
      - "traefik.http.routers.volleycoaching-storage.entrypoints=websecure"
      - "traefik.http.routers.volleycoaching-storage.tls.certresolver=letsencrypt"
      - "traefik.http.routers.volleycoaching-storage.service=volleycoaching-storage"
      - "traefik.http.services.volleycoaching-storage.loadbalancer.server.port=9000"

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: volleycoaching-adminer
    restart: always
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      - postgres
    networks:
      - volleycoaching_net
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.volleycoaching-adminer.rule=Host(`adminer-coach.florent-huitric.fr`)"
      - "traefik.http.routers.volleycoaching-adminer.entrypoints=websecure"
      - "traefik.http.routers.volleycoaching-adminer.tls.certresolver=letsencrypt"
      - "traefik.http.services.volleycoaching-adminer.loadbalancer.server.port=8080"

networks:
  volleycoaching_net:
    driver: bridge
  proxy:
    external: true

volumes:
  postgres_data:
    name: volleycoaching_postgres_data
  redis_data:
    name: volleycoaching_redis_data
  minio_data:
    name: volleycoaching_minio_data
